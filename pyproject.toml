[project]
name = "mariadb-server"
version = "0.2.3"
description = "MariaDB MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncmy>=0.2.10",
    "fastmcp[websockets]==2.12.1",
    "google-genai>=1.15.0",
    "numpy>=1.24.0",
    "openai>=1.78.1",
    "python-dotenv>=1.1.0",
    "tokenizers==0.21.2",
]

[tool.uv]
# uv.lock is resolved as of the 2026-04-19 production image build; move this forward with `uv lock --upgrade` to take newer releases.
exclude-newer = "2026-04-19T03:06:19Z"
